name: Keep Alive

on:
  schedule:
    - cron: '0 12 1 * *'  # Runs on the 1st of every month
  workflow_dispatch:       # Also lets you trigger it manually

permissions:
  contents: write #Allows the workflow to push commits

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Keep alive commit
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git commit --allow-empty -m "chore: keep-alive [skip ci]"
          git push
